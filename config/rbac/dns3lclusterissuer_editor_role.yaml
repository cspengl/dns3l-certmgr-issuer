# This rule is not used by the project dns3l-certmgr-issuer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dns3l.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dns3l-certmgr-issuer
    app.kubernetes.io/managed-by: kustomize
  name: dns3lclusterissuer-editor-role
rules:
- apiGroups:
  - dns3l.github.io
  resources:
  - dns3lclusterissuers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dns3l.github.io
  resources:
  - dns3lclusterissuers/status
  verbs:
  - get
