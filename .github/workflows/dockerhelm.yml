name: Dockerize and Helmify

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Docker image
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Init Helm
        uses: azure/setup-helm@v4

      - name: Build dependencies
        run: helm dependency build dist/chart

      - name: Lint chart
        run: helm lint dist/chart --strict

      - name: Render chart just to be sure
        run: |
          helm template test-release dist/chart \
            --namespace test \
            > /tmp/rendered-helm-manifests.yaml

  publish:
    name: Publish Docker image together with Helm chart
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      # ----- First, Docker -----

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=true

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Now Helm -----

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build Helm chart dependencies
        run: helm dependency build dist/chart

      - name: Package Helm chart
        run: |
          mkdir -p build/helm
          helm package dist/chart \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME#v}" \
            --destination build/helm

      - name: Log helm in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish Helm chart
        run: |
          helm push build/helm/*.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts
